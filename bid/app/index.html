<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>豆多成册 · 标书整编</title>
<meta name="description" content="本地把投标文件拼成一本：连续页码、自动目录、书签、骑缝章位。文件不上传。">
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#f6f8fc; --card:#fff; --line:#e3eaf3; --txt:#26333f; --dim:#5b6d7f; --faint:#7f8fa1;
    --amber:#f0a63c; --amber-ink:#8a5713; --amber-soft:#fdf2e0; --blue-soft:#e9f2fd;
    --radius:14px; --shadow:0 6px 20px rgba(18,35,60,.06);
  }
  html[data-theme="dark"]{
    --bg:#0f151d; --card:#161d26; --line:#26333f; --txt:#e6eef7; --dim:#9fb0c2; --faint:#7e8fa1;
    --amber:#f0a63c; --amber-ink:#f4c47e; --amber-soft:#241a0c; --blue-soft:#12202f;
    --shadow:0 6px 20px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--card)}
  .logo{width:34px;height:34px;border-radius:10px;background:var(--amber);color:#241a0c;display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:.5px}
  .brand b{font-size:16px}
  .brand span{display:block;font-size:12px;color:var(--dim)}
  .grow{flex:1}
  .hbtn{border:1px solid var(--line);background:transparent;color:var(--txt);border-radius:9px;padding:6px 11px;font-size:13px;cursor:pointer}
  .hbtn:hover{border-color:var(--amber)}
  main{max-width:1000px;margin:0 auto;padding:20px 22px 96px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--dim);border-radius:999px;padding:8px 18px;font-size:14px;cursor:pointer}
  .tab.on{background:var(--amber);border-color:var(--amber);color:#241a0c;font-weight:700}
  .drop{border:1px dashed var(--line);border-radius:var(--radius);background:var(--card);padding:26px;text-align:center;margin-bottom:14px}
  .drop.hot{border-color:var(--amber);background:var(--amber-soft)}
  .drop p{margin:0 0 10px;color:var(--dim)}
  .btn{border:0;border-radius:11px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;background:var(--amber);color:#241a0c}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:600}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
  .card h3{margin:0 0 10px;font-size:14px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
  .row label{color:var(--dim);font-size:13px;min-width:64px}
  select,input[type=text],input[type=number]{background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px}
  input[type=text]{min-width:180px}
  .hint{color:var(--faint);font-size:12.5px;margin:2px 0 0}
  .files{margin:0 0 12px}
  .file{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px}
  .file .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file .sz{color:var(--faint);font-size:12px}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;max-height:52vh;overflow:auto;padding:4px}
  .pcard{position:relative;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff;cursor:pointer}
  .pcard img,.pcard canvas{display:block;width:100%;height:auto}
  .pcard .no{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.68);color:#fff;font-size:11px;padding:1px 6px;border-radius:5px}
  .pcard .ch{position:absolute;right:4px;top:4px;background:var(--amber);color:#241a0c;font-size:11px;padding:1px 6px;border-radius:5px;font-weight:700}
  .pcard.sel{outline:2px solid var(--amber);outline-offset:-2px}
  table.ch{width:100%;border-collapse:collapse;font-size:13px}
  table.ch th{text-align:left;color:var(--dim);font-weight:600;border-bottom:1px solid var(--line);padding:6px 4px}
  table.ch td{padding:6px 4px;border-bottom:1px solid var(--line)}
  table.ch input[type=number]{width:64px}
  table.ch .x{cursor:pointer;color:var(--faint);border:0;background:none;font-size:14px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);background:var(--card);border:1px solid var(--line);color:var(--txt);padding:9px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:13px;opacity:0;pointer-events:none;transition:.18s;z-index:50}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:12px}
  .bar .st{color:var(--dim);font-size:12.5px;flex:1}
  .prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px;display:none}
  .prog.on{display:block}
  .prog i{display:block;height:100%;width:0;background:var(--amber);transition:width .2s}
  [hidden]{display:none!important}
</style>
<meta name="robots" content="noindex">
</head>
<body>
<header>
  <div class="logo">成册</div>
  <div class="brand"><b>豆多成册</b><span>投标文件整编 · 全部在本机完成，文件不上传</span></div>
  <div class="grow"></div>
  <button class="hbtn" id="langBtn">EN</button>
  <button class="hbtn" id="themeBtn">☾</button>
</header>

<main>
  <div class="tabs">
    <button class="tab on" data-mode="bind">成册</button>
    <button class="tab" data-mode="page">页面</button>
    <button class="tab" data-mode="ocr">识别文字</button>
    <button class="tab" data-mode="wm">水印</button>
  </div>

  <div class="drop" id="drop">
    <p>把要拼进标书的 PDF 拖进来，或点下面选择（可多选，按列表顺序合并）</p>
    <button class="btn" id="pickBtn">选择 PDF</button>
    <input type="file" id="fileInput" accept="application/pdf" multiple hidden>
  </div>

  <div class="files" id="files"></div>

  <!-- 成册 -->
  <section id="opt-bind">
    <div class="card">
      <h3>一、连续页码</h3>
      <div class="row">
        <label>格式</label>
        <select id="pnFormat">
          <option value="zhTotal" selected>第 X 页 共 Y 页</option>
          <option value="n">1</option>
          <option value="dash">- 1 -</option>
          <option value="zh">第 1 页</option>
          <option value="slash">1 / 20</option>
        </select>
        <label>字号</label>
        <select id="pnSize">
          <option value="xiaowu">小五 (9pt)</option>
          <option value="wuhao" selected>五号 (10.5pt)</option>
          <option value="xiaosi">小四 (12pt)</option>
        </select>
        <label>位置</label>
        <select id="pnPos">
          <option value="footer-center" selected>页脚居中</option>
          <option value="footer-right">页脚右</option>
          <option value="footer-left">页脚左</option>
          <option value="header-center">页眉居中</option>
        </select>
      </div>
      <div class="row">
        <label>起始编号</label><input type="number" id="pnStart" value="1" min="1" style="width:76px">
        <label>前几页不编号</label><input type="number" id="pnSkip" value="1" min="0" style="width:76px">
        <span class="hint">封面通常设 1；「从目录起编号」= 前几页填封面数</span>
      </div>
    </div>

    <div class="card">
      <h3>二、目录与书签</h3>
      <div class="row">
        <label><input type="checkbox" id="tocOn" checked> 插入目录页</label>
        <label>目录标题</label><input type="text" id="tocTitle" value="目　录" style="min-width:120px">
        <label>插在第</label><input type="number" id="tocAt" value="1" min="0" style="width:64px"><span class="hint">页（0 = 最前，1 = 封面后）</span>
      </div>
      <div class="row">
        <label><input type="checkbox" id="bmOn" checked> 生成 PDF 书签（阅读器左侧目录）</label>
      </div>
      <p class="hint">章节来自下面这张表：在「页面」标签里点缩略图加入，或在这里手动加。</p>
    </div>

    <div class="card">
      <h3>三、章节（目录依据）</h3>
      <table class="ch">
        <thead><tr><th style="width:70px">页码</th><th>标题</th><th style="width:80px">层级</th><th style="width:36px"></th></tr></thead>
        <tbody id="chBody"></tbody>
      </table>
      <div class="row" style="margin-top:10px">
        <input type="number" id="chPage" placeholder="页码" style="width:76px">
        <input type="text" id="chTitle" placeholder="章节标题，如 第二章 技术方案">
        <select id="chLevel"><option value="1">一级</option><option value="2">二级</option><option value="3">三级</option></select>
        <button class="btn ghost" id="chAdd">添加</button>
      </div>
    </div>
  </section>

  <!-- 页面 -->
  <section id="opt-page" hidden>
    <div class="card">
      <h3>点缩略图选择起始页，再「标为章节」</h3>
      <div class="row">
        <button class="btn ghost" id="pageAddCh" disabled>标为章节</button>
        <span class="hint" id="pagePick">未选中</span>
      </div>
      <div class="pgrid" id="pgrid"></div>
    </div>
  </section>

  <!-- 识别文字 -->
  <section id="opt-ocr" hidden>
    <div class="card">
      <h3>扫描件识别（可选）</h3>
      <p class="hint">招标文件里的扫描页如果搜不到字，勾这里会把识别结果做进导出的 PDF（每页约 3–5 秒）。</p>
      <div class="row">
        <label><input type="checkbox" id="ocrOn"> 导出前识别文字</label>
        <select id="ocrLang">
          <option value="chi_sim+eng" selected>中文 + 英文</option>
          <option value="chi_sim">中文</option>
          <option value="eng">英文</option>
        </select>
      </div>
      <div class="prog" id="prog"><i></i></div>
    </div>
  </section>

  <!-- 水印 -->
  <section id="opt-wm" hidden>
    <div class="card">
      <h3>水印（可选）</h3>
      <div class="row">
        <label><input type="checkbox" id="wmOn"> 加水印</label>
        <input type="text" id="wmText" placeholder="内部资料" style="min-width:160px">
        <label>透明度</label><input type="number" id="wmOpacity" value="0.08" step="0.02" min="0.02" max="0.5" style="width:76px">
      </div>
    </div>
  </section>
</main>

<div class="bar">
  <span class="st" id="status">还没有文件</span>
  <button class="btn" id="runBtn" disabled>导出成册 PDF</button>
</div>
<div class="toast" id="toast"></div>

<script type="importmap">
{"imports":{"pako":"./vendor/pako-shim.mjs"}}
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
