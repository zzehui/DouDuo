  <h1>关于</h1>
  <p class="sub">豆多科技（DOUDUO）不是公司，是一个人在做的小工具集合。</p>

  <h2 style="font-size:16px;margin:26px 0 8px">为什么都是「本地优先」</h2>
  <p style="color:var(--dim)">市面上的在线工具大多要把文件传到别人服务器。合同、发票、简历这些东西，传上去就多了一份风险。所以我做的每个工具都尽量在你自己的电脑上算完：断网打开照样能用，代码里也没有上传接口。</p>

  <h2 style="font-size:16px;margin:26px 0 8px">怎么收费</h2>
  <p style="color:var(--dim)">基础功能免费，够用就不必付钱。高级功能一次性买断（不做订阅），买了之后换电脑重新激活即可。</p>
