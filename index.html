<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>豆多科技 DOUDUO</title>
<meta name="description" content="豆多科技（douduo）个人开发者的小工具：PDF 口袋等。">
<style>
  :root{--bg:#0b0e13;--panel:#131922;--line:#243044;--tx:#eef2f7;--dim:#9aa7ba;--amber:#e8a33d}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.75 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:64px 24px 90px}
  h1{font-size:26px;margin:0 0 4px}
  .sub{color:var(--dim);margin:0 0 36px}
  .card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin:0 0 16px;text-decoration:none;color:inherit;transition:border-color .18s,transform .18s}
  .card:hover{border-color:var(--amber);transform:translateY(-1px)}
  .card h2{margin:0 0 6px;font-size:18px}
  .card p{margin:0;color:var(--dim);font-size:14px}
  .tag{display:inline-block;font-size:11px;color:#231703;background:var(--amber);border-radius:5px;padding:1px 6px;margin-left:8px;vertical-align:2px}
  footer{margin-top:40px;color:#6b7789;font-size:13px}
  a{color:var(--amber)}
</style>
</head>
<body>
<div class="wrap">
  <h1>豆多科技 · DOUDUO</h1>
  <p class="sub">一个人做的小工具。所有东西都尽量本地跑、不联网、不注册。</p>

  <a class="card" href="pdfpocket/">
    <h2>DOUDUO PDF 口袋 <span class="tag">主推</span></h2>
    <p>浏览器里合并、拆分、旋转、压缩 PDF。文件不上传，全程在本机完成。</p>
  </a>

  <footer>douduo 出品 · 个人开发者 · 联系：<a href="mailto:zzhlmgj@163.com">zzhlmgj@163.com</a></footer>
</div>
</body>
</html>
