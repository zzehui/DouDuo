<script>(function(){try{var t=localStorage.getItem("theme");if(t!=="light"&&t!=="dark"){t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";}document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

    <button class="themebtn" id="themeBtn" type="button" aria-label="切换深浅主题" title="切换深浅主题">☾</button>
  </nav>

  <p class="vision">把复杂的事，<br>做成<b>简单好用</b>的工具。</p>
  <p class="lede">豆多科技做小而克制的工具。我们相信好软件应该让人少绕几道弯——打开就能用，用完就忘掉它。</p>

<script>(function(){
  var b=document.getElementById("themeBtn"); if(!b) return;
  function paint(){var d=document.documentElement.dataset.theme==="light";b.textContent=d?"☀":"☾";b.title=d?"切换到深色":"切换到浅色";}
  paint();
  b.addEventListener("click",function(){
    var next=document.documentElement.dataset.theme==="light"?"dark":"light";
    document.documentElement.dataset.theme=next;
    try{localStorage.setItem("theme",next);}catch(e){}
    paint();
  });
  matchMedia("(prefers-color-scheme: light)").addEventListener("change",function(e){
    if(localStorage.getItem("theme")) return;
    document.documentElement.dataset.theme=e.matches?"light":"dark";paint();
  });
})();</script>
</body>
